<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-label="Minecraft Launcher">
  <!-- Original DUSMP monogram. Minecraft Launcher's own logo is not redistributable, so this
       identifies the launcher without reproducing its mark. -->
  <defs>
    <linearGradient id="official-f" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#6FBF4A"/>
      <stop offset="1" stop-color="#3A7A22"/>
    </linearGradient>
    <linearGradient id="official-s" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".30"/>
      <stop offset=".55" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="48" height="48" rx="12" fill="url(#official-f)"/>
  <rect width="48" height="48" rx="12" fill="url(#official-s)"/>
  <rect x=".6" y=".6" width="46.8" height="46.8" rx="11.4" fill="none" stroke="#000" stroke-opacity=".28"/>
  <text x="24" y="24" fill="#0B1406" fill-opacity=".92" text-anchor="middle" dominant-baseline="central"
        font-family="Inter, 'Segoe UI', system-ui, sans-serif" font-weight="800"
        font-size="16" letter-spacing="-.4">MC</text>
</svg>
